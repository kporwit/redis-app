---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  namespace: redis
  labels:
    environment: prod
    tier: cache
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/instance: sentinel
    app.kubernetes.io/version: "7.2"
    app.kubernetes.io/component: sentinel
data:
  sentinel.conf: |
    port 26379

    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes

    sentinel monitor mymain redis-0.redis-headless.redis.svc.cluster.local 6379 2

    sentinel down-after-milliseconds mymain 5000
    sentinel failover-timeout mymain 10000
    sentinel parallel-syncs mymain 1
    sentinel auth-user mymain sentinel
