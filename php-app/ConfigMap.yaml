---
apiVersion: v1
kind: ConfigMap
metadata:
  name: php-app-config
  namespace: php-app
  labels:
    environment: prod
    tier: frontend
    app.kubernetes.io/name: php-app
    app.kubernetes.io/instance: php-app
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: frontend
data:
  APP_ENV: production
  REDIS_USERNAME: app
  SENTINEL_ENDPOINT: sentinel.redis.svc.cluster.local:26379
  SENTINEL_NAME: mymain
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: index-template
  namespace: php-app
  labels:
    environment: prod
    tier: frontend
    app.kubernetes.io/name: php-app
    app.kubernetes.io/instance: php-app
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: frontend
data:
  index.php.tpl: |
    <?php
    echo "Hello World from ${APP_ENV}";
